spring:
  application:
    name: dental-erp-ms1
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ERP_DB_URL:jdbc:postgresql://localhost:5432/dental_erp}
    username: ${ERP_DB_USER:erp_user}
    password: ${ERP_DB_PASSWORD:erp_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    listener:
      simple:
        # Failed saga deliveries are rejected to the configured DLX, never requeued forever.
        default-requeue-rejected: false
    host: ${ERP_RABBIT_HOST:localhost}
    port: ${ERP_RABBIT_PORT:5672}
    username: ${ERP_RABBIT_USER:erp_user}
    password: ${ERP_RABBIT_PASSWORD:erp_password}
  graphql:
    graphiql:
      enabled: false
    schema:
      locations: classpath:graphql/
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/dental-platform}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-configured}
      chat:
        options:
          model: ${ERP_AI_MODEL:gpt-4o-mini}
          temperature: 0.0

server:
  port: ${ERP_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

erp:
  messaging:
    exchange: dental.topic.exchange
    consulta-finalizada-queue: erp.consulta.finalizada.queue
    consulta-finalizada-routing-key: clinica.consulta.finalizada
    dead-letter-exchange: dental.dlx.exchange
    consulta-finalizada-dlq: erp.consulta.finalizada.dlq
  idempotency:
    ttl-hours: 24
  pagofacil:
    mock-enabled: ${PAGOFACIL_MOCK_ENABLED:true}
    base-url: ${PAGOFACIL_BASE_URL:https://masterqr.pagofacil.com.bo/api/services/v2}
    token-service: ${PAGOFACIL_TOKEN_SERVICE:}
    token-secret: ${PAGOFACIL_TOKEN_SECRET:}
    callback-url: ${PAGOFACIL_CALLBACK_URL:http://localhost:8081/api/v1/webhooks/pagofacil}
    # LOCAL MOCK ONLY: X-Local-Mock-Secret; no production PagoFacil protocol is implemented.
    # Blank and change-me are rejected, including callback retries. See PagoFacilWebhookController.
    webhook-secret: ${PAGOFACIL_WEBHOOK_SECRET:}
    dev-simulation-enabled: false
    qr-expiration-minutes: 30
  n8n:
    enabled: ${N8N_ENABLED:false}
    webhook-url: ${N8N_WEBHOOK_URL:http://localhost:5678/webhook/erp-recibo-emitido}
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
  receipts:
    # Local file: URIs only; no new REST download endpoint. PDFs are best-effort after commit.
    storage-dir: ${ERP_RECEIPTS_STORAGE_DIR:${java.io.tmpdir}/erp-recibos}
  reports:
    max-rows: 500
    public-base-url: ${ERP_PUBLIC_BASE_URL:http://localhost:8081}
