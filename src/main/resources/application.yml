spring:
  application:
    name: dental-erp-ms1
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ERP_DB_URL:jdbc:postgresql://localhost:5432/dental_erp}
    username: ${ERP_DB_USER:erp_user}
    password: ${ERP_DB_PASSWORD:erp_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    listener:
      simple:
        # Billing saga: only poison goes to DLQ; technical/persistence failures explicitly request requeue.
        default-requeue-rejected: false
    host: ${ERP_RABBIT_HOST:localhost}
    port: ${ERP_RABBIT_PORT:5672}
    username: ${ERP_RABBIT_USER:erp_user}
    password: ${ERP_RABBIT_PASSWORD:erp_password}
  graphql:
    graphiql:
      enabled: false
    schema:
      locations: classpath:graphql/
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/dental-platform}
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        type: SYNC
        name: dental-erp-ms1
        version: 1.0.0
        streamable-http:
          mcp-endpoint: /mcp
    openai:
      api-key: ${OPENAI_API_KEY:not-configured}
      chat:
        options:
          model: ${ERP_AI_MODEL:gpt-4o-mini}
          temperature: 0.0

server:
  port: ${ERP_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

erp:
  billing-saga:
    retry:
      max-attempts: ${ERP_BILLING_SAGA_RETRY_MAX_ATTEMPTS:3}
      initial-delay-ms: ${ERP_BILLING_SAGA_RETRY_INITIAL_DELAY_MS:100}
      max-delay-ms: ${ERP_BILLING_SAGA_RETRY_MAX_DELAY_MS:2000}
      redelivery-delay-ms: ${ERP_BILLING_SAGA_RETRY_REDELIVERY_DELAY_MS:1000}
    outbox:
      enabled: ${ERP_BILLING_SAGA_OUTBOX_ENABLED:true}
      max-attempts: ${ERP_BILLING_SAGA_OUTBOX_MAX_ATTEMPTS:5}
      batch-size: ${ERP_BILLING_SAGA_OUTBOX_BATCH_SIZE:1}
      send-timeout-ms: ${ERP_BILLING_SAGA_OUTBOX_SEND_TIMEOUT_MS:2000}
      initial-backoff-ms: ${ERP_BILLING_SAGA_OUTBOX_INITIAL_BACKOFF_MS:1000}
      max-backoff-ms: ${ERP_BILLING_SAGA_OUTBOX_MAX_BACKOFF_MS:300000}
      poll-delay-ms: ${ERP_BILLING_SAGA_OUTBOX_POLL_DELAY_MS:1000}
  cors:
    # Explicit origins only (never '*'). Empty = CORS disabled, no Access-Control-* headers are emitted.
    allowed-origins: ${ERP_CORS_ALLOWED_ORIGINS:}
    max-age-seconds: 600
  security:
    jwt:
      audience: ${ERP_JWT_AUDIENCE:ms-erp}
    local-dev-user:
      # Profile 'local' only (startup fails otherwise): X-Dev-User header authentication. See application-local.yml.
      enabled: false
  messaging:
    exchange: dental.topic.exchange
    consulta-finalizada-queue: erp.consulta.finalizada.queue
    consulta-finalizada-routing-key: clinica.consulta.finalizada
    facturacion-rechazada-routing-key: ${ERP_BILLING_SAGA_REJECTED_ROUTING_KEY:facturacion.consulta.rechazada}
    dead-letter-exchange: dental.dlx.exchange
    consulta-finalizada-dlq: erp.consulta.finalizada.dlq
  idempotency:
    ttl-hours: 24
  pagofacil:
    mock-enabled: ${PAGOFACIL_MOCK_ENABLED:true}
    base-url: ${PAGOFACIL_BASE_URL:https://masterqr.pagofacil.com.bo/api/services/v2}
    token-service: ${PAGOFACIL_TOKEN_SERVICE:}
    token-secret: ${PAGOFACIL_TOKEN_SECRET:}
    callback-url: ${PAGOFACIL_CALLBACK_URL:http://localhost:8081/api/v1/webhooks/pagofacil}
    # LOCAL MOCK ONLY: X-Local-Mock-Secret; no production PagoFacil protocol is implemented.
    # Blank and change-me are rejected, including callback retries. See PagoFacilWebhookController.
    webhook-secret: ${PAGOFACIL_WEBHOOK_SECRET:}
    dev-simulation-enabled: false
    qr-expiration-minutes: 30
  n8n:
    enabled: ${N8N_ENABLED:false}
    webhook-url: ${N8N_WEBHOOK_URL:http://localhost:5678/webhook/erp-recibo-emitido}
    webhook-secret: ${N8N_WEBHOOK_SECRET:}
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
  receipts:
    # Explicit development default. Deployments select s3 (alias: minio); never falls back on failure.
    # Private bucket provisioning and scoped credentials: docs/s3-receipts.md.
    mode: ${ERP_RECEIPTS_MODE:local}
    storage-dir: ${ERP_RECEIPTS_STORAGE_DIR:${java.io.tmpdir}/erp-recibos}
    minio:
      endpoint: ${ERP_RECEIPTS_MINIO_ENDPOINT:}
      access-key: ${ERP_RECEIPTS_MINIO_ACCESS_KEY:}
      secret-key: ${ERP_RECEIPTS_MINIO_SECRET_KEY:}
      bucket: ${ERP_RECEIPTS_MINIO_BUCKET:}
      # provider: aws (IAM credential chain when keys are blank; region required) or s3-compatible (SeaweedFS; static keys).
      provider: ${ERP_RECEIPTS_MINIO_PROVIDER:s3-compatible}
      region: ${ERP_RECEIPTS_MINIO_REGION:}
      expiry-seconds: ${ERP_RECEIPTS_MINIO_EXPIRY_SECONDS:300}
      connect-timeout-ms: 1000
      read-timeout-ms: 2000
      write-timeout-ms: 2000
      call-timeout-ms: 5000
  reports:
    # Lazy dedicated pool; blank credentials disable ONLY reports. No writable-DB fallback.
    # Provision a new nonowner SELECT-only login manually with scripts/reporting-role.sql after V5.
    db-url: ${ERP_REPORT_DB_URL:${spring.datasource.url}}
    db-user: ${ERP_REPORT_DB_USER:}
    db-password: ${ERP_REPORT_DB_PASSWORD:}
    # Fixed security bounds: pool=2, acquire/query=3s, socket=5s, rows=500,
    # columns=16, cell text=128, cache=64 reports / 600s absolute TTL (per principal access).
    # AI receives the original bounded question and approved schema, never DB rows/patient records.
    # Do not include personal data in questions or enable prompt/provider payload logging.
