# Local development profile: no Keycloak required, GraphiQL enabled, PagoFacil mocked.
spring:
  graphql:
    graphiql:
      enabled: true
  jpa:
    show-sql: false

erp:
  security:
    dev-mode: true
  pagofacil:
    mock-enabled: true
    dev-simulation-enabled: true

logging:
  level:
    com.dentalplatform.erp: DEBUG
