# SNAPSHOT of the GraphQL operations consumed by the Angular microfrontend mf-erp.
# Sources (read-only, copied verbatim, with the TypeScript ${...} field constants expanded inline):
#   apps/mf-erp/src/app/core/graphql/queries.graphql.ts
#   apps/mf-erp/src/app/core/graphql/mutations.graphql.ts
#   apps/mf-erp/src/app/features/catalogs/catalogs.graphql.ts
# It is NOT regenerated automatically: if the frontend changes, update this file and docs/frontend-contract-diff.md.
# Each block starts with "#@ <name> expect=VALID|INVALID" (expectation = what docs/frontend-contract-diff.md states
# against the real schema). FrontendExamplesValidationTest validates every block and reports the errors.

#@ ListarPacientes expect=INVALID
query ListarPacientes($busqueda: String) {
  listarPacientes(busqueda: $busqueda) { id ciNit nombres apellidos telefonoWhatsapp email fechaNacimiento }
}

#@ ListarOdontologos expect=INVALID
query ListarOdontologos {
  listarOdontologos { id nombres apellidos matricula telefono activo especialidad { id nombre } }
}

#@ ListarEspecialidades expect=VALID
query ListarEspecialidades {
  listarEspecialidades { id nombre descripcion }
}

#@ ListarConsultorios expect=INVALID
query ListarConsultorios {
  listarConsultorios { id nombre ubicacion activo }
}

#@ ListarServiciosOdontologicos expect=INVALID
