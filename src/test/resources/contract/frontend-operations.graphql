}

#@ ListarOrdenesCobro expect=INVALID
query ListarOrdenesCobro($estado: EstadoOrdenCobro) {
  listarOrdenesCobro(estado: $estado) { id codigo origen concepto montoTotal descuento montoNeto estado tipoPago fechaCreacion
  paciente { id ciNit nombres apellidos }
  cuotas { id numero monto fechaVencimiento estado } }
}

#@ ObtenerOrdenCobro expect=INVALID
query ObtenerOrdenCobro($id: ID!) {
  obtenerOrdenCobro(id: $id) { id codigo origen concepto montoTotal descuento montoNeto estado tipoPago fechaCreacion
  paciente { id ciNit nombres apellidos }
  cuotas { id numero monto fechaVencimiento estado } }
}

#@ ConsultarEstadoQrPagoFacil expect=INVALID
query ConsultarEstadoQrPagoFacil($pagofacilTransactionId: String!) {
  consultarEstadoQrPagoFacil(pagofacilTransactionId: $pagofacilTransactionId) {
    pagofacilTransactionId qrImagenBase64 monto fechaExpiracion estado
    recibo { id numeroRecibo fechaEmision monto metodoPago ciNit razonSocial concepto urlDescargaPdf }
  }
}

#@ ObtenerResumenCaja expect=INVALID
query ObtenerResumenCaja($fechaDesde: String!, $fechaHasta: String!) {
  obtenerResumenCaja(fechaDesde: $fechaDesde, fechaHasta: $fechaHasta) { totalIngresos totalEgresos saldoNeto }
}

#@ ListarMovimientosCaja expect=INVALID
query ListarMovimientosCaja($fechaDesde: String!, $fechaHasta: String!) {
  listarMovimientosCaja(fechaDesde: $fechaDesde, fechaHasta: $fechaHasta) {
    id fecha tipo categoria concepto metodoPago monto reciboId
  }
}

#@ GenerarReporteInteligente expect=VALID
query GenerarReporteInteligente($pregunta: String!) {
  generarReporteInteligente(pregunta: $pregunta) {
    explicacionNatural consultaSqlEjecutada columnas filasJson tipoGraficoSugerido urlDescargaExcel urlDescargaPdf
  }
}

