# Valid operations of the REAL contract (src/main/resources/graphql/schema.graphqls), referenced from
# docs/frontend-contract-diff.md. FrontendExamplesValidationTest validates the document AND coerces the variables
# against the served schema, and checks that the doc contains each block verbatim.
# Block format: "#@ <name>", optional "#@vars <single-line JSON>", then the GraphQL document.
# UUIDs are placeholders: take real ones from the seed (T2) or from a previous response.

#@ ListarPacientes
query ListarPacientes($busqueda: String) {
  listarPacientes(busqueda: $busqueda) { id ciNit nombres apellidos fechaNacimiento genero telefonoWhatsapp email direccion }
}
#@vars {"busqueda": "Rojas"}

