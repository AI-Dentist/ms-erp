name: dental-erp
services:
  postgres-erp:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: dental_erp
      POSTGRES_USER: ${ERP_DB_USER:?Set ERP_DB_USER in root .env}
      POSTGRES_PASSWORD: ${ERP_DB_PASSWORD:?Set ERP_DB_PASSWORD in root .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - dental-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
  ms1-erp:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ERP_PORT: 8080
    expose:
      - "8080"
    depends_on:
      postgres-erp:
        condition: service_healthy
    networks:
      - dental-net
volumes:
  postgres-data:
networks:
  dental-net:
    external: true
